name: Release

on:
  push:
    branches:
      - 'release/v0.1.0-rc.1'

permissions:
  contents: write

env:
  RELEASE_VERSION: v0.1.0-rc.1
  RELEASE_TARGET_SHA: 7510ef2dda5413249e6698d909a3983346967e4b

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_TARGET_SHA"
          notes="docs/releases/${RELEASE_VERSION}.md"
          test -f "$notes"
          if git rev-parse "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate release package
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer verify

      - name: Smoke install package from source
        shell: bash
        run: |
          set -euo pipefail
          consumer="$(mktemp -d)"
          cd "$consumer"
          cat > composer.json <<JSON
          {
            "name": "nexus/release-smoke-consumer",
            "minimum-stability": "dev",
            "prefer-stable": true,
            "repositories": [
              {
                "type": "path",
                "url": "${GITHUB_WORKSPACE}",
                "options": {"symlink": false}
              }
            ],
            "require": {
              "nexus/framework": "@dev"
            }
          }
          JSON
          composer install --no-interaction --prefer-dist --no-dev
          vendor/bin/nexus about

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_VERSION" "$RELEASE_TARGET_SHA" -m "Nexus Framework $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_VERSION}.md"
          gh release create "$RELEASE_VERSION" \
            --title "Nexus Framework $RELEASE_VERSION" \
            --notes-file "$notes" \
            --prerelease
